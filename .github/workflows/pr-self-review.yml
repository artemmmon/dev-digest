# pr-self-review skill — script tests (routing, hashing, verdict, gate, real git push through the hook).
# They build throw-away git repos in a temp dir: no network, no Docker, no dependencies to install.
# Also: the guard hooks' tests, the spec-authoring and feature-flow check tests, and the spec check itself.
name: pr-self-review

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/pr-self-review/**'
      - '.claude/skills/spec-authoring/**'
      - '.claude/skills/feature-flow/**'
      - '.claude/skills/workflow-retro/**'
      - 'scripts/check-changed.sh'
      - '.claude/hooks/**'
      - '.claude/agents/**'
      - '.claude/settings.json'
      - 'specs/**'
      - '*/specs/**'
      - 'scripts/install-hooks.sh'
      - '.github/workflows/pr-self-review.yml'
  pull_request:
    paths:
      - '.claude/skills/pr-self-review/**'
      - '.claude/skills/spec-authoring/**'
      - '.claude/skills/feature-flow/**'
      - '.claude/skills/workflow-retro/**'
      - 'scripts/check-changed.sh'
      - '.claude/hooks/**'
      - '.claude/agents/**'
      - '.claude/settings.json'
      - 'specs/**'
      - '*/specs/**'
      - 'scripts/install-hooks.sh'
      - '.github/workflows/pr-self-review.yml'

permissions:
  contents: read

jobs:
  scripts:
    name: script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test '.claude/skills/pr-self-review/assets/tests/*.test.mjs'
      - run: node --test '.claude/hooks/*.test.mjs' '.claude/skills/spec-authoring/assets/tests/*.test.mjs' '.claude/skills/feature-flow/assets/tests/*.test.mjs' '.claude/skills/workflow-retro/assets/tests/*.test.mjs'
      - run: node .claude/skills/spec-authoring/assets/check-spec.mjs
